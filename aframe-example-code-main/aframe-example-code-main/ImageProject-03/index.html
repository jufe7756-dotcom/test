<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
      <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>

  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sky" src="/aframe-example-code-main/aframe-example-code-main/JuliaFeign-SpaceChess/testbg.jpeg">
        <a-asset-item id="pawns" src="/aframe-example-code-main/aframe-example-code-main/JuliaFeign-SpaceChess/chess_piece_-_pawn/scene.gltf"></a-asset-item>
        <a-asset-item id="knights" src="/aframe-example-code-main/aframe-example-code-main/JuliaFeign-SpaceChess/chess_piece_-_knight/scene.gltf"></a-asset-item>
      </a-assets>
      <a-sky src="#sky"></a-sky>
      <a-entity environment="preset: checkerboard; dressingAmount: 1"></a-entity>
      <a-entity gltf-model="#pawns" scale="10 10 10" position="-.5 1 .5" ></a-entity>
      <a-entity gltf-model="#knights" scale="10 10 10" position="-.5 1 -.5" ></a-entity>
      <a-sphere position="-1 2 -3" radius="-30" color="#FFFFFF" src="/aframe-example-code-main/aframe-example-code-main/JuliaFeign-SpaceChess/testbg.jpeg"></a-sphere>
    </a-scene>
  </body>
</html>
